{% extends "base.html" %}

{% block titulo %}Restablecer contraseña - CanchaApp{% endblock %}

{% block contenido %}
<section class="seccion-gris">
    <div class="contenedor">
        <div class="tarjeta-formulario">
            <h1>Nueva contraseña</h1>
            <p class="texto-ayuda">
                Ingresa el código de 6 dígitos que recibiste en tu correo y elige tu nueva contraseña.
            </p>

            <form method="POST" action="/restablecer_contrasena">
                <div class="campo-formulario">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        value="{{ correo }}"
                        placeholder="Ej: laura@correo.com"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="codigo">Código de recuperación (6 dígitos)</label>
                    <input
                        type="text"
                        id="codigo"
                        name="codigo"
                        placeholder="Ej: 482910"
                        maxlength="6"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="nueva_contrasena">Nueva contraseña</label>
                    <input
                        type="password"
                        id="nueva_contrasena"
                        name="nueva_contrasena"
                        placeholder="Mínimo 6 caracteres"
                        minlength="6"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="confirmar_contrasena">Confirmar nueva contraseña</label>
                    <input
                        type="password"
                        id="confirmar_contrasena"
                        name="confirmar_contrasena"
                        placeholder="Repite tu nueva contraseña"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" class="boton boton-principal boton-ancho">
                    Cambiar contraseña
                </button>
            </form>

            <p class="enlace-inferior">
                <a href="/olvide_contrasena">Solicitar un nuevo código</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
